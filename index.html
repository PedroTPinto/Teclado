<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Teclado Alfabético Virtual</title>
    <style>
        body {
            font-family: Arial, "Segoe UI", sans-serif;
            background-color: #EAF1F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            color: #17293B;
            margin-bottom: 4px;
            font-size: 26px;
        }
        #output {
            width: 100%;
            max-width: 650px;
            height: 130px;
            font-size: 28px;
            font-family: inherit;
            padding: 14px;
            border: 2px solid #AEC2D4;
            border-radius: 12px;
            resize: none;
            margin-bottom: 22px;
            color: #17293B;
            background: #FFFFFF;
        }
        .keyboard-section {
            width: 100%;
            max-width: 650px;
            margin-bottom: 18px;
        }
        .section-title {
            font-weight: bold;
            color: #45596B;
            margin-bottom: 8px;
            font-size: 17px;
        }

        /* As teclas têm tamanho fixo e simplesmente quebram para a
           linha seguinte quando não cabem mais — não esticam nem
           encolhem consoante o número de botões por linha. */
        .grid-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        button {
            flex: 0 0 auto;
            width: 100px;
            height: 66px;
            font-size: 22px;
            font-weight: bold;
            background-color: #ffffff;
            color: #17293B;
            border: 1px solid #AEC2D4;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }
        button:active { background-color: #D3E6F7; }
        button:focus-visible {
            outline: 3px solid #0B57A4;
            outline-offset: 2px;
        }
        .btn-wide { width: 205px; background-color: #E3ECF3; }
        .btn-danger { background-color: #F6D9D6; }
        .btn-phrase {
            width: 205px;
            background-color: #FFF7E4;
            border: 1px solid #E4BE72;
            color: #5B3E10;
            font-size: 17px;
        }
        .btn-phrase:active { background-color: #FBEBC5; }
    </style>
</head>
<body>

    <h2>Teclado Virtual Alfabético</h2>
    <textarea id="output" placeholder="O texto vai aparecer aqui..."></textarea>

    <!-- Seção de Números -->
    <div class="keyboard-section">
        <div class="section-title">Números</div>
        <div class="grid-row">
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>

    <!-- Seção de Letras -->
    <div class="keyboard-section">
        <div class="section-title">Letras (A-Z)</div>
        <div class="grid-row">
            <button onclick="press('A')">A</button>
            <button onclick="press('B')">B</button>
            <button onclick="press('C')">C</button>
            <button onclick="press('D')">D</button>
            <button onclick="press('E')">E</button>
            <button onclick="press('F')">F</button>
            <button onclick="press('G')">G</button>
            <button onclick="press('H')">H</button>
            <button onclick="press('I')">I</button>
            <button onclick="press('J')">J</button>
            <button onclick="press('K')">K</button>
            <button onclick="press('L')">L</button>
            <button onclick="press('M')">M</button>
            <button onclick="press('N')">N</button>
            <button onclick="press('O')">O</button>
            <button onclick="press('P')">P</button>
            <button onclick="press('Q')">Q</button>
            <button onclick="press('R')">R</button>
            <button onclick="press('S')">S</button>
            <button onclick="press('T')">T</button>
            <button onclick="press('U')">U</button>
            <button onclick="press('V')">V</button>
            <button onclick="press('W')">W</button>
            <button onclick="press('X')">X</button>
            <button onclick="press('Y')">Y</button>
            <button onclick="press('Z')">Z</button>
        </div>
    </div>

    <!-- Seção de Controles -->
    <div class="keyboard-section">
        <div class="grid-row">
            <button class="btn-wide" onclick="press(' ')">⎵ ESPAÇO</button>
            <button class="btn-wide" onclick="backspace()">⌫ APAGAR</button>
            <button class="btn-wide btn-danger" onclick="clearAll()">❌ LIMPAR</button>
        </div>
    </div>

    <!-- Seção de Frases Rápidas -->
    <div class="keyboard-section">
        <div class="section-title">Frases Rápidas</div>
        <div class="grid-row">
            <button class="btn-phrase" onclick="phrase('Sim')">Sim</button>
            <button class="btn-phrase" onclick="phrase('Não')">Não</button>
        </div>
    </div>

    <script>
        const txt = document.getElementById('output');
        function press(char) { txt.value += char; }
        function phrase(text) {
            txt.value += (txt.value && !txt.value.endsWith(' ') ? ' ' : '') + text + ' ';
        }
        function backspace() { txt.value = txt.value.slice(0, -1); }
        function clearAll() {
            if (txt.value.length === 0) return;
            if (confirm('Tem a certeza que quer apagar todo o texto?')) {
                txt.value = '';
            }
        }
    </script>
</body>
</html>
